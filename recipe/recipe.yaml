context:
  version: "2026.7.16"
  # upstream refs: https://github.com/jdx/mise/blob/main/scripts/build-tarball.sh & https://github.com/jdx/mise/blob/main/scripts/build-tarball.ps1
  base_features: native-tls,rustls-native-roots,vfox/vendored-lua
  extra_features: ${{ ",aws-lc-rs" if target_platform == "linux-armv7l" else "" }}
  self_update_msg: "This version of mise was installed from conda-forge, a community-maintained channel of Conda packages. Use your Conda package manager (`conda`, `mamba`, `pixi` etc.) to update mise."

package:
  name: mise
  version: ${{ version }}

source:
  url: https://github.com/jdx/mise/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ba6ea274b741d9db01665e5f3d3e01c0fdb45db7d0f50fe65bcec96074b375dd

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: "thin" # `rustc-LLVM` runs out of memory with `fat` LTO
      CARGO_PROFILE_RELEASE_STRIP: symbols
      OPENSSL_NO_VENDOR: 1
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      # (fixes compilation of `zstd-sys`)
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    content:
      # NOTE: we have to set LIBCLANG_PATH for bindgen to find libclang
      # cf. https://github.com/conda-forge/clangdev-feedstock/issues/373 & https://github.com/rust-lang/rust-bindgen/issues/918
      - if: unix
        then:
          - export LIBCLANG_PATH="$BUILD_PREFIX"/lib
          - cargo auditable install --path=. --root="$PREFIX" --no-track --locked --bins --no-default-features --features=${{ base_features }}${{ extra_features }}
          # write custom `mise self-update` message
          - mkdir -p "$PREFIX"/lib
          - echo 'message = "${{ self_update_msg }}"' > "$PREFIX"/lib/mise-self-update-instructions.toml
          # copy manpage
          - mkdir -p "$PREFIX"/share/man/man1
          - cp man/man1/mise.1 "$PREFIX"/share/man/man1/mise.1
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - mkdir -p "$PREFIX"/share/bash-completion/completions "$PREFIX"/share/fish/vendor_completions.d "$PREFIX"/share/zsh/site-functions
              - '"$PREFIX"/bin/mise completion bash > "$PREFIX"/share/bash-completion/completions/mise'
              - '"$PREFIX"/bin/mise completion fish > "$PREFIX"/share/fish/vendor_completions.d/mise.fish'
              - '"$PREFIX"/bin/mise completion zsh  > "$PREFIX"/share/zsh/site-functions/_mise'
      - if: win
        then:
          # bindgen expects libclang.dll; conda-forge only provides versioned DLLs on Windows
          - powershell -Command "cp (gci $env:BUILD_PREFIX\Library\bin\libclang-*.dll)[0] $env:BUILD_PREFIX\Library\bin\libclang.dll"
          - set "LIBCLANG_PATH=%BUILD_PREFIX%\Library\bin"
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --locked --bins --no-default-features --features=${{ base_features }}${{ extra_features }}
          - cargo auditable install --path=crates\mise-shim --root="%LIBRARY_PREFIX%" --no-track --locked --bins
          # write custom `mise self-update` message
          - if not exist "%LIBRARY_PREFIX%"\lib mkdir "%LIBRARY_PREFIX%"\lib
          - echo message = "${{ self_update_msg }}"> "%LIBRARY_PREFIX%"\lib\mise-self-update-instructions.toml
          # copy manpage
          - if not exist "%LIBRARY_PREFIX%"\share\man\man1 mkdir "%LIBRARY_PREFIX%"\share\man\man1
          - powershell -Command "Copy-Item -Path 'man/man1/mise.1' -Destination '%LIBRARY_PREFIX%\share\man\man1\mise.1'"
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - if not exist "%LIBRARY_PREFIX%"\share\bash-completion\completions mkdir "%LIBRARY_PREFIX%"\share\bash-completion\completions
              - if not exist "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d   mkdir "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d
              - if not exist "%LIBRARY_PREFIX%"\share\zsh\site-functions          mkdir "%LIBRARY_PREFIX%"\share\zsh\site-functions
              - '"%LIBRARY_BIN%"\mise.exe completion bash > "%LIBRARY_PREFIX%\share\bash-completion\completions\mise"'
              - '"%LIBRARY_BIN%"\mise.exe completion fish > "%LIBRARY_PREFIX%\share\fish\vendor_completions.d\mise.fish"'
              - '"%LIBRARY_BIN%"\mise.exe completion zsh  > "%LIBRARY_PREFIX%\share\zsh\site-functions\_mise"'
      - cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - clang
    - cmake
    - libclang
    - make
    - ninja
    - pkg-config
  host:
    - if: linux
      then: openssl
    - usage

tests:
  - script:
      env:
        MISE_NO_CONFIG: 1
        MISE_OFFLINE: 1
      content:
        - mise help
        - mise version
  - package_contents:
      bin:
        - mise
        - if: win
          then: mise-shim
      files:
        - if: unix
          then:
            - lib/mise-self-update-instructions.toml
            - share/man/man1/mise.1
            - if: build_platform == host_platform
              then:
                - share/bash-completion/completions/mise
                - share/fish/vendor_completions.d/mise.fish
                - share/zsh/site-functions/_mise
        - if: win
          then:
            - Library/lib/mise-self-update-instructions.toml
            - Library/share/man/man1/mise.1
            - if: build_platform == host_platform
              then:
                - Library/share/bash-completion/completions/mise
                - Library/share/fish/vendor_completions.d/mise.fish
                - Library/share/zsh/site-functions/_mise
      strict: true

about:
  summary: mise manages dev tools, env vars, and runs tasks.
  description: |
    `mise` (mise-en-place) is a unified CLI tool designed to simplify and manage local development environments.
    It acts as a polyglot tool version manager, installing and seamlessly switching between versions of various
    development tools (replacing utilities like `asdf`, `nvm`, and `pyenv`). Additionally, it functions as an
    environment variable manager that dynamically loads project-specific env vars based on your current directory
    (replacing `direnv`), and serves as a built-in task runner to define and execute project workflows as a modern
    alternative to `make` or `npm` scripts.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://mise.jdx.dev/
  repository: https://github.com/jdx/mise

extra:
  recipe-maintainers:
    - salim-b
